version: '1.0.0'

player:
  enable: true

# /stat 展示消息 — 注意 key 名称必须与 Command.kt 中的 config.getStringList("messages.player.messages") 一致
messages:
  player:
    messages:
      - "&7=========================="
      - "&6玩家: &f%name%"
      - "&6击杀: &f%kills%"
      - "&6死亡: &f%deaths%"
      - "&6K/D: &f%kd%"
      - "&6加入: &f%joins%"
      - "&6退出: &f%quits%"
      - "&6在线时长: &f%formatted-online-time%"
      - "&7=========================="
    time-day: "天"
    time-hour: "时"
    time-minute: "分"
    time-second: "秒"
    permission-placeholders:
      2b2tcore.example:
        if-has: "&e&l已授权"
        if-not: "&c&l未授权"
