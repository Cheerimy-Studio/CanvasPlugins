name: X-Clearlag
version: 1.7
main: com.fabian.xclearlag.XClearlag
api-version: 1.13
folia-supported: true
authors: [Fabian]
website: https://xproyects.qzz.io
description: "Advanced entity and item cleanup plugin for Paper, Purpur, Folia & Bukkit (1.8.8+)."

commands:
  xcl:
    description: Main command for X-Clearlag
    aliases: [xclearlag, cl, clear]
    permission: xclearlag.admin

softdepend: [PlaceholderAPI]

permissions:
  xclearlag.admin:
    description: Full access to X-Clearlag commands.
    default: op
  xclearlag.admin.stats:
    description: Access to cleanup history and statistics.
    default: op
  xclearlag.admin.reload:
    description: Allows reloading the plugin configuration.
    default: op
  xclearlag.notify:
    description: Receive notifications when a cleanup is triggered.
    default: op