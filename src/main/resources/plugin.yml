name: 2B2TCore
main: luminus.acng.taboolib.platform.BukkitPlugin
version: 2.5.2
authors:
  - 'NaN'
api-version: "1.21"
folia-supported: true
softdepend: [ItemTag]
description: 2B2TCore - Anarchy server core plugin for Folia / Canvas

permissions:
  2b2tcore.reload:
    description: 重载插件配置 /core
    default: op
  2b2tcore.suicide:
    description: 使用 /suicide /514 自杀
    default: true
  2b2tcore.stat:
    description: 查看玩家统计 /stat
    default: op
  2b2tcore.dupe.command:
    description: 使用 /dupe 复制手持物品
    default: op
  2b2tcore.dupe.original:
    description: 复制出的物品为原版（不带复制品词条）
    default: op
  2b2tcore.dupe.chicken.xin:
    description: 鸡复制 Xin 模式
    default: op
  2b2tcore.dupe.chicken.click:
    description: 鸡复制点击模式
    default: op
  2b2tcore.dupe.donkey.xin:
    description: 驴复制 Xin 模式
    default: op
  2b2tcore.dupe.donkey.org:
    description: 驴复制 Org 模式
    default: op
  2b2tcore.dupe.item-frame:
    description: 物品展示框复制
    default: op
  2b2tcore.dupe.mine-and-place:
    description: 破坏放置复制
    default: op
  2b2tcore.chatcolor.vip:
    description: VIP 聊天颜色（黄色）
    default: op
  2b2tcore.chatcolor.op:
    description: OP 聊天颜色（红色）
    default: op
  2b2tcore.runmax:
    description: 允许在地狱 128 层以上活动
    default: op

# 所有命令均注册到 plugin.yml，确保覆盖原版命令（如 /help）并可靠注册。
# 权限检查在代码内完成（Taboolib command() / hasPermission），此处不声明
# permission 字段避免双重检查导致报错信息不一致。
commands:
  help:
    description: 查看 2B2T 帮助菜单
    usage: /<command>
  stat:
    description: 查看玩家统计
    usage: /<command> [玩家]
  dupe:
    description: 复制手持物品
    usage: /<command>
  core:
    description: 插件管理命令
    usage: /<command> <info|reload|clearcache>
  suicide:
    description: 自杀
    usage: /<command>
    aliases: [514]
