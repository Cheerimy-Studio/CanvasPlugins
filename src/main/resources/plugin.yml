name: TNT-Optimizer
version: '4.0.0'
main: com.tntoptimizer.TNTOptimizer
api-version: '1.21'
folia-supported: true
description: "Canvas Core TNT 爆炸优化（异步射线追踪 + 空间聚类 + 跨区域并行写回）基于 Minecraft 26.2 反编译验证的爆炸机制，完全还原原版体验。兼容 Canvas/Folia 26.2 及所有依赖 EntityExplodeEvent 的 TNT 类插件。"
author: Cheerimy
website: https://github.com/Cheerimy-Studio/CanvasPlugins

permissions:
  tntoptimizer.admin:
    description: 允许重载插件配置
    default: op

commands:
  tntoptimizer:
    description: TNT-Optimizer 主命令
    usage: /tntoptimizer reload|status|benchmark
    permission: tntoptimizer.admin
