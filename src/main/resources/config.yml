# 2B2TCore 配置文件
# 适用核心：Folia / Canvas（26.2）
# 所有功能均已在区域线程内同步执行，符合 Folia 线程安全规则
# GitHub: https://github.com/Cheerimy-Studio/CanvasPlugins

# 配置版本号（请勿手动修改，由插件自动管理）
config-ver: 13

# ===================== 复制功能 =====================
duplication:
  # 命令复制：通过 /dupe 复制手持物品（权限：2b2tcore.dupe.command）
  command:
    enable: false
    multiply-times: 2  # 复制倍数
    max-amount: 16   # 单次复制数量上限

  # 物品展示框复制：旋转展示框时有概率掉落其内物品（权限：2b2tcore.dupe.item-frame）
  item-frame:
    enable: true
    possibility: 1  # 触发概率（百分比，0-100）

  # 鸡刷复制
  chicken:
    # Xin 模式：将潜影盒存入鸡中，每隔指定分钟数掉落（权限：2b2tcore.dupe.chicken.xin）
    xin-mode: true
    xin-mode-interval: 60        # 每隔多少分钟刷新一次
    xin-mode-max-per-chunk: 3   # 每个区块最多几只有效鸡（超出的显示浓烟，不刷物）
    # 点击模式：右键鸡时复制手持物品（权限：2b2tcore.dupe.chicken.click）
    click-mode: false
    click-mode-cooldown: 3  # 冷却时间（秒）

  # 驴复制
  donkey:
    # Xin 模式：击杀驴兽时掉落其库存（权限：2b2tcore.dupe.donkey.xin）
    xin-mode: true
    # Org 模式：骑乘驴兽下线时复制其库存（权限：2b2tcore.dupe.donkey.org）
    org-mode: false
    # Org 模式下是否允许处理船链上的驴兽
    org-mode-allow-boat-chain: false

  # 破坏放置复制：累计破坏潜影盒到指定次数时复制（权限：2b2tcore.dupe.mine-and-place）
  mine-and-place:
    enable: true
    amount: 100  # 触发复制所需破坏次数

  # 复制品标记：所有复制产生的物品都会带有「复制品」词条（lore + PDC 标记）
  # 复制品不可被二次复制；拥有权限 2b2tcore.dupe.original 的玩家复制出的物品为原版（不带词条）
  # 复制品同时带 ItemTag 禁止交互特性（不可交易/合成/附魔/铁砧/磨石/锻造/死亡消失），
  # 潜影盒 / 收纳袋（Bundle）内部物品递归打标
  replica:
    enable: true
    lore: "&7复制品"  # 复制品词条文本（支持 & 颜色代码）
    itemtag-flags: true  # 是否写入 ItemTag 禁止交互 flag（需安装 ItemTag 插件）
    deny-cooldown-seconds: 60  # 复制品拦截提示冷却（秒，同一玩家间隔内最多提醒一次）

# ===================== 传送石道具 =====================
# 合成链：传送碎片 → 传送核心 → 传送石
# - 传送碎片：龙蛋 + 8 种块（煤炭/铁/金/青金石/钻石/下界合金/绿宝石/红石块，无序）
# - 传送核心：9 个传送碎片
# - 传送石：传送核心 + 潮涌核心/海洋之心/沉重核心/鞘翅/末影珍珠/三种蛙明灯
# 传送碎片/核心带复制品词条（不可二次复制），但传送碎片与核心仍可参与合成。
# 传送石本体：随机唯一 ID + 耐久（默认 10），无复制品称号，只能通过展示框复制（每次耐久 -1）；
# 复制品继承 ID、带复制品称号，不可二次复制，可「吃掉」传送到持有本体玩家处。
teleport:
  enable: true      # 总开关
  durability: 10    # 传送石本体耐久（每次复制复制品 -1）

# ===================== 自杀命令 =====================
# 启用后玩家可使用 /suicide（别名 /514）自杀（权限：2b2tcore.suicide）
suicide-enable: true

# ===================== 出生点 / 重生随机传送 =====================
# 新玩家首次加入时随机传送到世界出生点周围，并获得一定时间无敌
# 死亡重生时，若玩家未设置床/重生锚，也随机传送到出生点周围
spawn:
  enable: true                # 总开关，false 则关闭随机传送
  radius: 500                 # 随机传送范围（出生点 ± N 格内）
  invulnerability-seconds: 10  # 无敌时间（秒，0 则不给；首次加入和重生均生效）
  respawn-random: true        # 死亡重生时无床/锚则随机重生

# ===================== 地狱顶层（Y > 128）限制器 =====================
# 任何玩家在地狱超过 128 层会被强制传回下方安全处，
# 并清理周围已加载区块 Y > 128 的方块和实体，且禁止在上层搭建方块（含 OP）。
nether-roof:
  # 总开关
  enable: true
  # 清理半径（区块数，0 表示仅当前区块，最大 2）
  cleanup-radius-chunks: 2
  # 禁止搭建提示冷却（秒，同一玩家间隔内最多提示一次）
  message-cooldown-seconds: 60

# ===================== 聊天颜色（需安装 PistonChat）=====================
# 未安装 PistonChat 时本段无效，不会触发其事件类加载
chat-color:
  enable: true  # 总开关（默认开启）
  # 默认颜色：当玩家不匹配任何权限组时使用，留空表示不修改原颜色
  # 支持 & 代码（如 &7）、RRGGBB（如 #AAAAAA）
  default-color: "&7"
  # 权限组：自上而下匹配，首个命中的权限组生效
  groups:
    vip:
      permission: "2b2tcore.chatcolor.vip"
      color: "&e"
    op:
      permission: "2b2tcore.chatcolor.op"
      color: "&c"

# ===================== 消息文本 =====================
# 支持旧版 & 颜色代码
messages:
  success-dupe: "&e&l成功复制物品！"
  no-item: "&c你必须手持一个物品才能复制！"
  deny-redupe: "&c复制品无法再次复制！"
  suicide: "&7你已自杀。"
  # /help 命令输出格式（支持 %placeholder% 占位符）
  # 含功能占位符的行在该功能未启用时整行不输出
  # 可用功能占位符：%suicide% %dupe-cmd% %item-frame% %chicken% %donkey% %mine-place% %chat-color% %stat%
  help:
    lines:
      - "&e===== &62B2T &e====="
      - " "
      - "%suicide%"
      - "%dupe-cmd%"
      - "%item-frame%"
      - "%chicken%"
      - "%donkey%"
      - "%mine-place%"
      - "%stat%"
