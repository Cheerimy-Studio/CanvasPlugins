plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = 'com.lichenaut'
version = '1.4.3'

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://oss.sonatype.org/content/groups/public/' }
}

dependencies {
    compileOnly 'dev.folia:folia-api:26.2.build.1-beta'
    implementation 'commons-io:commons-io:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.25.2'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.2'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    implementation 'org.bstats:bstats-bukkit:3.0.2'
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10) {
        options.release = targetJavaVersion
    }
}

processResources {
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand version: project.version
    }
}

shadowJar {
    archiveBaseName = 'DatapackLoader'
    archiveFileName = 'DatapackLoader-' + version + '.jar'
    relocate 'org.bstats', 'com.lichenaut.datapackloader'
}

assemble.dependsOn(shadowJar)
