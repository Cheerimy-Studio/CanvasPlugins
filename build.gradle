plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = 'cc.baka9'
version = '2.0.0-paper26.2'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'dmulloy2-repo'
        url = 'https://repo.dmulloy2.net/repository/public/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Paper API 26.2锛圕anvas 26.2 = MC 26.2锛夛紝鍚戜笅鍏煎 Spigot/Paper/Folia
    compileOnly 'io.papermc.paper:paper-api:26.2.build.105-stable'
    // Velocity API锛圥roxy 绔彃浠讹紝compileOnly锛屽悓涓€ jar 鍙岀閮ㄧ讲锛?
    compileOnly 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
    // Log4j2锛堟湇鍔″櫒鑷甫锛宑ompileOnly 鐢ㄤ簬缂栬瘧 Log4jFilter锛屼笉 shade 閬垮厤鍐茬獊锛?
    compileOnly 'org.apache.logging.log4j:log4j-core:2.24.3'
    // ProtocolLib锛坰oftdepend锛屽彲閫夛級
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    // 杩愯鏃朵緷璧栵紙shade 杩?jar锛?
    implementation 'org.xerial:sqlite-jdbc:3.21.0.1'
    implementation 'com.sun.mail:jakarta.mail:1.6.7'
    compileOnly 'mysql:mysql-connector-java:8.0.28'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java {
            // BungeeCord 绔簮鐮佷繚鐣欎絾鎺掗櫎缂栬瘧锛圥aper 绔笉闇€瑕侊紝閬垮厤 Bungee API 渚濊禆锛?
        }
    }
}

shadowJar {
    archiveBaseName = 'CatSeedLogin'
    archiveClassifier = ''
    archiveVersion = project.version
    // 鍏佽閲嶅鏉＄洰锛坧lugin.yml + velocity-plugin.json 鍏卞瓨鍚屼竴 jar锛?
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 娉ㄦ剰锛氫笉鑳?relocate org.sqlite 鈥斺€?SQLite.java 鐢?Class.forName("org.sqlite.JDBC") 瀛楃涓插姞杞斤紝
    // relocate 涓嶄細鏀瑰啓瀛楃涓诧紝浼氬鑷?ClassNotFoundException銆?
    // 涓嶇敤 minimize 鈥斺€?sqlite-jdbc 閫氳繃鍙嶅皠鍔犺浇锛岄潤鎬佸垎鏋愪細璇垹銆?
}

// 璁?jar 涔熸帴鍙楅噸澶嶏紙velocity-plugin.json 鍙兘璺?bungee 璧勬簮鍐茬獊锛?
tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

build.dependsOn(shadowJar)
