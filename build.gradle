plugins {
    id 'java'
}

group = 'de.myzelyam'
version = '6.3.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.essentialsx.net/releases' }
    maven { url = 'https://repo.dmulloy2.net/nexus/repository/public/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.citizensnpcs.co/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://repo.mikeprimm.com/' }
    maven { url = 'https://libraries.minecraft.net' }
    maven { url = 'https://maven.enginehub.org/repo/' }
}

// Exclude bukkit/spigot-api from ALL configurations to avoid conflicts with folia-api
configurations.configureEach {
    exclude group: 'org.bukkit', module: 'bukkit'
    exclude group: 'org.bukkit', module: 'craftbukkit'
    exclude group: 'org.spigotmc', module: 'spigot-api'
    exclude group: 'org.spigotmc', module: 'spigot'
}

dependencies {
    // Folia API (superset of Paper API)
    compileOnly 'dev.folia:folia-api:26.2.build.1-beta'
    // EssentialsX
    compileOnly('net.essentialsx:EssentialsX:2.19.0') { exclude group: 'org.bstats' }
    // ProtocolLib (stub — only available at runtime via softdepend)
    compileOnly files('libs/ProtocolLib-4.8.0.jar')
    // Vault API
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    // Citizens API
    compileOnly 'net.citizensnpcs:citizensapi:2.0.28-SNAPSHOT'
    // TrailGUI
    compileOnly 'com.github.SinnDevelopment:TrailGUI:37659dda03'
    // Dynmap
    compileOnly 'us.dynmap:dynmap-api:3.1'
    // MVdW Placeholder API (stub — only available at runtime via softdepend)
    compileOnly files('libs/MVdWPlaceholderAPI-3.1.1-SNAPSHOT.jar')
    // PlaceholderAPI (stub — only available at runtime via softdepend)
    compileOnly files('libs/PlaceholderAPI-2.10.10.jar')
    // Brigadier
    implementation 'com.mojang:brigadier:1.3.5'
    // OpenInv
    compileOnly 'com.github.Jikoo:OpenInv:5.1.12'
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version, 'project.version': version, 'project': [version: version]]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
