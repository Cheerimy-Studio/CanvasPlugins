# ===== NCP+SadAC 配置 =====
# 将此段添加到 plugins/NoCheatPlus/config.yml 末尾
# 注意：/sad 命令修改的值会自动写回此配置（持久化）

sadac:
  lag:
    # 高频红石 & 实体清理（总开关）
    enabled: true
    # 红石更新间隔阈值（毫秒）— 低于此频率视为高频，自动移除红石元件
    # 值越小越严格：1=最快检测，10000+=几乎不检测
    redstone-interval-ms: 50
    # 每区块最大经验球+船数量 — 超出部分自动清理
    max-entities-per-chunk: 50
    # 实体清理扫描半径（区块数，1-10）— 以玩家为中心的正方形半径
    # 例：3 = 7×7=49 个区块；值越大清理范围越广，性能消耗越高
    scan-radius: 3
